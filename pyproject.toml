[project]
name = "kyb-screening"
version = "0.1.0"
description = "Automated KYB screening: ingestion of public company registers and sanctions lists (bronze/silver/gold)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
kyb-ingest = "kyb.ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kyb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
